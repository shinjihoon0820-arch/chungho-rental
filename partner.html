<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파트너점 모집 - 청호나이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-center text-blue-600 mb-4">
                <i class="fas fa-handshake mr-2"></i>파트너점 모집
            </h1>
            <p class="text-center text-gray-600 text-lg mb-8">함께 성장할 파트너를 찾습니다</p>
            
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                    <img src="https://i.imgur.com/lQjzTo0.png" alt="파트너점 모집" class="w-full h-auto object-contain">
                </div>
            </div>
            
            <div class="text-center mt-8">
                <a href="/" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition inline-block">
                    <i class="fas fa-home mr-2"></i>홈으로 돌아가기
                </a>
            </div>
        </div>
    </div>
</body>
</html>
