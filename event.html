<style>
  :root{--blue:#2563eb;--blue-deep:#1d4ed8;--blue-soft:#eff6ff;--line:#e3edf9;--ink:#4b5563;--navy:#0f172a;--red:#ef4444;--red-soft:#fef2f2;}
  body{font-family:'Pretendard',system-ui,sans-serif;color:var(--navy);background:#eef2f7;}
  .phone{max-width:460px;margin:0 auto;background:#fff;min-height:100vh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.06);}
  .eyebrow{letter-spacing:.24em;font-weight:700;font-size:11px;color:var(--blue);}
  .deal-pill{background:var(--red);color:#fff;}
  .seg{position:relative;color:#8aa0bd;font-weight:700;font-size:13px;padding:10px 2px;cursor:pointer;text-align:center;}
  .seg .em{display:block;font-size:18px;margin-bottom:3px;}
  .seg.active{color:var(--navy);}
  .seg.active::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:30px;height:3px;border-radius:3px;background:var(--blue);}
  .panel{display:none}.panel.active{display:block;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wave{display:block;width:100%;height:36px}
  .glow{background:radial-gradient(70% 60% at 70% 0%, #dcebff 0%, rgba(255,255,255,0) 65%);}
  .card{background:#fff;border:1px solid var(--line);}
  .chip{background:var(--blue-soft);color:var(--blue-deep);font-weight:700;}
  #menu{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  #menu.open{max-height:480px;}

    <div class="seg" data-tab="t4"><span class="em">🏢</span>사업자</div>
  </div>

  <main class="px-4 py-6">
    <section class="panel active" id="t1">
      <p class="eyebrow mb-1">THANK YOU</p>
      <h2 class="text-xl font-extrabold mb-1" id="t1-title"></h2>

      <div class="space-y-3" id="t1-items"></div>
      <div class="rounded-2xl p-4 mt-3 text-center text-sm font-semibold" style="background:var(--red-soft);color:#b91c1c" id="t1-notice"></div>

    <section class="panel" id="t2">

    <section class="panel" id="t3">
      <p class="eyebrow mb-1">BEST COMBO</p>

      <p class="text-sm mb-4" style="color:var(--ink)" id="t3-desc"></p>

    </section>

    <section class="panel" id="t4">
      <p class="eyebrow mb-1">FOR BUSINESS</p>
      <h2 class="text-xl font-extrabold mb-1" id="t4-title"></h2>
      <p class="text-sm mb-4" style="color:var(--ink)" id="t4-desc"></p>
      <div class="grid grid-cols-2 gap-3" id="t4-items"></div>
    </section>

    <section id="apply" class="rounded-3xl p-6 mt-8" style="background:var(--blue-soft)">
      <p class="eyebrow text-center mb-1">CONSULTATION</p>
      <h3 class="text-lg font-extrabold text-center mb-1">👉 무료 상담 신청</h3>
      <p class="text-center text-xs mb-4" style="color:var(--ink)">연락처만 남겨주시면 이달의 혜택을 안내해 드려요.</p>
      <form id="ev-form" class="space-y-2.5">
        <input type="text" id="f-name" placeholder="고객명" class="w-full rounded-xl px-4 py-3 border" style="border-color:var(--line)">
        <input type="tel" id="f-phone" placeholder="연락처 (010-0000-0000)" class="w-full rounded-xl px-4 py-3 border" style="border-color:var(--line)">
        <label class="flex items-start gap-2 text-xs" style="color:var(--ink)"><input type="checkbox" id="f-privacy" class="mt-0.5"><span>[필수] 개인정보 수집 및 이용 동의</span></label>
        <button type="submit" class="w-full text-white font-bold py-3.5 rounded-2xl" style="background:linear-gradient(135deg,var(--blue),var(--blue-deep))">상담 신청하기</button>
        <a href="tel:16603128" class="block text-center text-sm font-bold py-1" style="color:var(--blue-deep)">📞 바로 전화 상담 1660-3128</a>
      </form>
    </section>
  </main>

  <footer class="text-slate-300 text-xs" style="background:var(--navy)">
    <div class="px-5 py-6">
      <p class="font-bold text-white mb-1">(주)청호나이스 공식렌탈몰</p>
      <p>📞 대표전화 1660-3128</p>
    </div>
  </footer>

  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[460px] z-40 border-t" style="background:#fff;border-color:var(--line)">
    <div class="flex items-center gap-2 px-3 py-2 text-sm">
      <a href="tel:16603128" class="flex-1 text-center font-bold py-2.5 rounded-xl border-2" style="border-color:var(--blue);color:var(--blue-deep)">📞 전화상담</a>
      <a href="#apply" class="flex-1 text-center text-white font-bold py-2.5 rounded-xl" style="background:var(--blue)">👉 상담신청</a>

<script>
const DEFAULTS = {
  monthLabel:"2026 · JUNE · 이달의 이벤트",
  title:'6월 <span style="color:var(--blue)">최대 할인 혜택</span>을<br>받아가세요',
  subtitle:'지금 상담 신청하시면 이번 달 한정<br><b style="color:var(--navy)">할인·사은품 혜택</b>을 바로 안내해 드려요.',
  startDate:"2026-06-01", endDate:"2026-06-30",
  deadlineLabel:"6월 30일 마감",
  applyLabel:"[이벤트] 6월 무료상담",
  chips:["🏷️ 렌탈료 반값할인","🎁 사은품 증정","🔧 설치 무료"],
  benefits:[
    {emoji:"🏷️",title:"렌탈료<br>반값할인"},
    {emoji:"🔧",title:"설치·답사<br>무료"},
    {emoji:"🎁",title:"사은품<br>증정"},
  ],
  thanks:{title:"💙 고객 감사 이벤트", desc:"믿어주신 고객님께 드리는 이달의 감사 혜택입니다.",
    items:[
      {emoji:"💸",title:"감사 추가 할인",desc:"상담 신청 고객께 이달의 추가 할인을 적용해 드립니다."},
      {emoji:"🎁",title:"선택형 사은품",desc:"생활가전·상품권 등 원하시는 사은품을 선택하실 수 있습니다."},
    ], notice:"📢 무료 상담 신청하시면 감사 혜택을 안내해 드립니다."},
  tradein:{title:"🔄 타사보상 이벤트", desc:"쓰시던 타사 제품, 청호나이스로 바꾸면 더 큰 혜택으로 보상.",
    items:[
      {rank:"1위",name:"The M",term:"72개월 약정",normal:"45,900",sale:"36,900",off:"648,000"},
      {rank:"2위",name:"뉴 아이스트리",term:"72개월 약정",normal:"45,900",sale:"39,900",off:"432,000"},
      {rank:"3위",name:"슈퍼아이스트리",term:"60개월 약정",normal:"61,900",sale:"47,900",off:"840,000"},
    ]},
  combo:{title:"⭐ 인기상품 이벤트", desc:"함께 쓰면 혜택도 PLUS. 이달의 인기 조합.",
    items:[
      {name:"BEST 조합",term:"72개월 약정",aName:"The M 얼음정수기",aPrice:"45,900",bName:"비데 B360",bPrice:"15,900",normalTotal:"61,800",saleTotal:"50,800",save:"792,000"},
      {name:"가정용 실속형 냉온정수기 조합",aName:"직수형 냉온정수기",aPrice:"19,900",bName:"비데 B360",bPrice:"12,900",total:"32,800"},
      {name:"가정용 실속형 얼음정수기 조합",aName:"OMNI 얼음정수기",aPrice:"31,900",bName:"비데 B360",bPrice:"12,900",total:"44,800"},
    ]},
  business:{title:"🏢 사업자 할인", desc:"매장·사무실·사업장 맞춤 컨설팅과 사업자 전용 조건.",
    items:[
      {emoji:"📋",title:"맞춤 견적·무료 답사"},
      {emoji:"🤝",title:"사업자 전용 조건"},
      {emoji:"🎧",title:"전담 사후관리"},
      {emoji:"📦",title:"다대수 패키지"},
    ]},
};

function esc(s){return (s==null?'':String(s));}
function comboCard(p){
  const pair=`<div class="flex items-center justify-center gap-3 text-center text-sm font-bold mb-2">
     <span>${esc(p.aName)}<br><span class="text-xs font-normal" style="color:#8aa0bd">월 ${esc(p.aPrice)}원</span></span>
     <span style="color:var(--blue)" class="text-lg">+</span>
     <span>${esc(p.bName)}<br><span class="text-xs font-normal" style="color:#8aa0bd">월 ${esc(p.bPrice)}원</span></span>
   </div>`;
  if(p.saleTotal){
    return `<div class="card rounded-2xl p-4">
      <div class="flex items-center gap-2 mb-2"><span class="text-white text-xs font-bold px-2.5 py-1 rounded-full" style="background:var(--blue)">${esc(p.name)}</span>${p.term?`<span class="text-xs" style="color:#8aa0bd">${esc(p.term)}</span>`:''}</div>
      ${pair}
      <p class="text-center text-sm" style="color:var(--ink)"><span class="line-through">월 ${esc(p.normalTotal)}원</span> ➜ <span style="color:var(--blue)" class="font-extrabold text-lg">월 ${esc(p.saleTotal)}원</span></p>
      <div class="deal-pill text-center font-bold rounded-xl py-2 mt-2">총 ${esc(p.save)}원 절약</div>
    </div>`;
  }
  return `<div class="card rounded-2xl p-4">
    <span class="inline-block text-white text-xs font-bold px-2.5 py-1 rounded-full mb-2" style="background:var(--blue)">${esc(p.name)}</span>
    ${pair}
    <div class="text-center rounded-xl py-2 mt-1 font-extrabold" style="background:var(--blue-soft);color:var(--blue-deep)">월 합계 ${esc(p.total)}원</div>
  </div>`;
}

function render(ev){
  document.getElementById('ev-eyebrow').textContent=ev.monthLabel;
  document.getElementById('ev-title').innerHTML=ev.title;
  document.getElementById('ev-sub').innerHTML=ev.subtitle;
  document.getElementById('ev-chips').innerHTML=(ev.chips||[]).map(c=>`<span class="chip rounded-full px-2.5 py-1">${esc(c)}</span>`).join('');
  document.getElementById('ev-benefits').innerHTML=(ev.benefits||[]).map(b=>`<div class="card rounded-xl py-4 px-1"><div class="text-2xl mb-1">${esc(b.emoji)}</div><p class="font-bold text-xs leading-tight">${b.title}</p></div>`).join('');
  document.getElementById('t1-title').textContent=ev.thanks.title;
  document.getElementById('t1-desc').textContent=ev.thanks.desc;
  document.getElementById('t1-items').innerHTML=(ev.thanks.items||[]).map(i=>`<div class="card rounded-2xl p-5"><div class="flex items-center gap-2 mb-1"><span class="text-lg">${esc(i.emoji)}</span><h3 class="font-bold">${esc(i.title)}</h3></div><p class="text-sm" style="color:var(--ink)">${esc(i.desc)}</p></div>`).join('');
  document.getElementById('t1-notice').textContent=ev.thanks.notice;
  document.getElementById('t2-title').textContent=ev.tradein.title;
  document.getElementById('t2-desc').textContent=ev.tradein.desc;
  document.getElementById('t2-items').innerHTML=(ev.tradein.items||[]).map(p=>`<div class="card rounded-2xl p-4"><div class="flex items-center gap-2 mb-2">${p.rank?`<span class="text-white text-xs font-bold px-2 py-0.5 rounded-full" style="background:var(--blue)">${esc(p.rank)}</span>`:''}<h4 class="font-bold">💧 ${esc(p.name)}</h4></div><p class="text-xs" style="color:#8aa0bd">${esc(p.term)} · <span class="line-through">월 ${esc(p.normal)}원</span></p><p class="text-sm" style="color:var(--ink)">보상 적용가 <span style="color:var(--blue)" class="font-extrabold text-xl">월 ${esc(p.sale)}원</span></p><div class="deal-pill text-center font-bold rounded-xl py-2 my-2">최대 ${esc(p.off)}원 렌탈료 할인</div></div>`).join('');
  document.getElementById('t3-title').textContent=ev.combo.title;
  document.getElementById('t3-desc').textContent=ev.combo.desc;
  document.getElementById('t3-items').innerHTML=(ev.combo.items||[]).map(comboCard).join('');
  document.getElementById('t4-title').textContent=ev.business.title;
  document.getElementById('t4-desc').textContent=ev.business.desc;
  document.getElementById('t4-items').innerHTML=(ev.business.items||[]).map(i=>`<div class="card rounded-2xl p-4"><div class="text-xl mb-1">${esc(i.emoji)}</div><h3 class="font-bold text-sm">${esc(i.title)}</h3></div>`).join('');
  document.getElementById('ev-deadline').textContent='⏰ '+(ev.deadlineLabel||'마감');
  const start=new Date((ev.startDate||ev.endDate)+'T00:00:00'), end=new Date(ev.endDate+'T23:59:59'), now=new Date();
  const total=end-start, left=end-now, dleft=Math.max(0,Math.ceil(left/864e5));
  document.getElementById('dday').textContent= left<=0?'마감':('D-'+dleft);
  document.getElementById('bar').style.width=Math.min(100,Math.max(0,(1-left/total)*100))+'%';
  window.__applyLabel = ev.applyLabel || '[이벤트] 무료상담';
}

document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');
}));

document.getElementById('ev-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  if(!name){alert('고객명을 입력해주세요.');return;}
  if(!/^[0-9-]+$/.test(phone)||phone.length<9){alert('연락처를 정확히 입력해주세요.');return;}
  if(!document.getElementById('f-privacy').checked){alert('개인정보 수집 및 이용에 동의해주세요.');return;}
  const btn=e.target.querySelector('button[type=submit]'); const o=btn.textContent;
  btn.disabled=true; btn.textContent='신청 중...';
  try{
    await axios.post('/api/applications',{name,phone,productId:0,productName:window.__applyLabel||'[이벤트] 무료상담',address:'',message:'이벤트 페이지 상담 신청'});
    alert('상담 신청이 완료되었습니다!\n담당자가 곧 연락드리겠습니다.');
    e.target.reset();
  }catch(err){ alert('신청 중 오류가 발생했습니다. 전화 상담(1660-3128)도 가능합니다.'); }
  finally{ btn.disabled=false; btn.textContent=o; }
});

(async function(){
  let ev = DEFAULTS;
  try{
    const r = await axios.get('/api/settings');
    const ep = r && r.data && r.data.eventPage;
    if(ep && typeof ep==='object'){
      ev = Object.assign({}, DEFAULTS, ep);
      ['thanks','tradein','combo','business'].forEach(k=>{ if(ep[k]) ev[k]=Object.assign({}, DEFAULTS[k], ep[k]); });
    }
  }catch(e){}
  render(ev);
})();
</script>
</body>
</html>
